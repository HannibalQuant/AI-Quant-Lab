[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-quant-lab"
version = "0.1.0"
description = "Governed non-execution foundations for AI Quant Lab"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quant_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff.format]
exclude = ["src/ai_quant_lab/core/governance.py"]

[tool.ruff.lint.per-file-ignores]
"src/ai_quant_lab/core/governance.py" = ["E501", "E731"]
